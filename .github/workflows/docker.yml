name: docker

# Construit et pousse les images sur GHCR :
#   - à chaque tag v*      -> ghcr.io/<owner>/shss:<version> + :latest (+ -cuda)
#   - sur main             -> ghcr.io/<owner>/shss:edge
# La cible CUDA n'est pas testée en CI (pas de GPU sur les runners) mais
# elle compile.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/shss
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build+push (cpu)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build+push (cuda)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shss:${{ github.ref_name }}-cuda
            ghcr.io/${{ github.repository_owner }}/shss:latest-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max
